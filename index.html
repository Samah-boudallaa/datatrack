<title>KPI Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f1f4f6;--surface:#ffffff;--surface2:#e9eef1;--ink:#0d1a22;--muted:#586a77;--line:#d6dfe5;
  --accent:#0a6f77;--accent-ink:#ffffff;--accent-soft:#d9eff0;
  --ok:#1b7f4b;--ok-soft:#dcf2e5;--bad:#b4332b;--bad-soft:#fae3e0;--warn:#8f5a00;--warn-soft:#faecd0;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1216;--surface:#131c22;--surface2:#1a262e;--ink:#e5edf1;--muted:#92a4b0;--line:#25353f;
  --accent:#4cc3cc;--accent-ink:#04252a;--accent-soft:#11373c;
  --ok:#55c98a;--ok-soft:#10301f;--bad:#ff8c82;--bad-soft:#3a1916;--warn:#f0b84d;--warn-soft:#33260a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1216;--surface:#131c22;--surface2:#1a262e;--ink:#e5edf1;--muted:#92a4b0;--line:#25353f;
  --accent:#4cc3cc;--accent-ink:#04252a;--accent-soft:#11373c;
  --ok:#55c98a;--ok-soft:#10301f;--bad:#ff8c82;--bad-soft:#3a1916;--warn:#f0b84d;--warn-soft:#33260a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.4rem}h3{font-size:1.02rem}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.mark svg{display:block}
.brand b{font-size:1.02rem;display:block;line-height:1.2}
.brand span{color:var(--muted);font-size:.82rem;display:block}
.nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:500;font-size:.92rem}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.muted{color:var(--muted)}.small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}.bar .m{background:var(--warn)}.bar .a{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.kpi b{display:block;font:600 1.6rem/1.2 var(--f-mono)}
.kpi span{color:var(--muted);font-size:.82rem}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font:600 1.9rem/1 var(--f-mono)}
.ring .t span{font-size:.72rem;color:var(--muted)}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--accent)}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{color:var(--accent)}
.sec ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.trap{background:var(--warn-soft);border-radius:10px;padding:14px 16px}
.trap h3{color:var(--warn)}
.trap ul{margin:6px 0 0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);padding:1px 5px;border-radius:4px}
/* schémas */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.node{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:600;font-size:.9rem}
.arr{color:var(--accent);font-weight:700}
.fun{display:flex;flex-direction:column;gap:7px}
.fr{display:flex;flex-direction:column;gap:3px}
.fr .lh{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.fr .vl{font-weight:600}
.fr .tr{position:relative;height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fr .tr i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.fr .ls{font:500 .76rem var(--f-mono);color:var(--bad)}
.fr.worst .tr i{background:var(--bad)}
/* qcm */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qtext{font-size:1.12rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font:600 .85rem var(--f-mono);flex:none;width:1.7em;height:1.7em;border-radius:6px;background:var(--surface2);display:grid;place-items:center;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{background:var(--ok);color:var(--bg)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .l{background:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.expl{padding:12px 14px;border-radius:8px;background:var(--surface2)}
.expl.good{background:var(--ok-soft)}.expl.bad{background:var(--bad-soft)}
.tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.gen{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted)}
kbd{font:500 .78rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.xbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.timer{font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qn{font:600 .8rem var(--f-mono);width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qn.done{background:var(--surface2);border-color:var(--muted)}
.qn.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.qn.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score{font:700 3rem/1 var(--f-mono)}
.banner{padding:12px 14px;border-radius:8px;background:var(--warn-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.rv summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:flex-start}
details.rv .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.n{background:var(--muted)}
/* cartes */
.fcard{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:26px 22px;cursor:pointer}
.fcard.back{background:var(--accent-soft);border-color:var(--accent)}
.fcard .q{font-size:1.25rem;font-weight:700;line-height:1.35}
.fcard .a{font-size:1.02rem;line-height:1.6}
/* graphique */
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tg{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--muted);font:9px var(--f-mono)}
.chart text.v{fill:var(--ink);font-weight:600}
.th{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:10px;align-items:center}
.th .nm{font-size:.9rem}
textarea{width:100%;min-height:96px;font:.8rem/1.4 var(--f-mono);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

<script>
(function(){
"use strict";
const Q=[];
const q=(ch,t,c,a,b,d,e)=>Q.push({ch:ch,t:t,o:[c,a,b,d],e:e});
//QSTART
/* ---------- Séance 1 : Introduction ---------- */
q(1,"Quelle affirmation distingue correctement Analytics et Analysis ?","L’analytics est une discipline (méthodes + outils) plus large que l’analyse d’un tableau de données","Ce sont deux synonymes exacts","L’analysis est plus large que l’analytics","L’analytics désigne uniquement la collecte des données","Analysis = examen et interprétation. Analytics = discipline + méthodes + outils pour produire des insights qui éclairent les décisions.");
q(1,"« Le site a enregistré 8 000 visiteurs et 240 achats » correspond à :","Data (données collectées)","Analysis","Analytics","Une décision","Ce sont des faits mesurés : c’est de la donnée brute.");
q(1,"« Pourquoi les visiteurs abandonnent-ils le site après la page produit ? » relève de :","Analysis (examen et interprétation)","Data","La collecte","L’archivage","Une question qui cherche à comprendre un comportement est une question d’analyse.");
q(1,"Quelle chaîne relie Data, Analysis, Insight et Decision ?","DATA → ANALYSIS → INSIGHT → DECISION","ANALYSIS → DATA → DECISION → INSIGHT","INSIGHT → DATA → ANALYSIS → DECISION","DECISION → DATA → INSIGHT → ANALYSIS","On part des données, on les analyse, on en tire un insight, puis on décide.");
q(1,"Quelle est la question centrale du Web Analytics ?","« Que voulons-nous améliorer ? »","« Quel outil installer ? »","« Combien de visiteurs avons-nous ? »","« Quel est le coût du serveur ? »","On commence par l’objectif d’amélioration, pas par l’outil ni par le chiffre.");
q(1,"Le cycle du Web Analytics est :","Collecter → Mesurer → Analyser → Interpréter → Agir","Mesurer → Collecter → Agir → Analyser → Interpréter","Analyser → Collecter → Mesurer → Agir → Interpréter","Collecter → Analyser → Mesurer → Agir → Interpréter","Le cours donne : COLLECTER, MESURER, ANALYSER, INTERPRÉTER, AGIR.");
q(1,"Quels sont les quatre axes d’amélioration cités ?","Acquisition, Engagement, Conversion, Expérience utilisateur","Acquisition, Hébergement, Conversion, Design","Trafic, Cookies, Logs, Tags","Visibilité, Coût, Valeur, Rétention","Les quatre axes : Acquisition • Engagement • Conversion • Expérience utilisateur.");
q(1,"Quel est l’enjeu fondamental du Web Analytics ?","Obtenir des insights significatifs pour maximiser la réussite des investissements digitaux","Produire le maximum de rapports","Collecter le plus de données possible","Remplacer toute décision humaine par un outil","Les 5 enjeux : performance, insights, ROI/succès, décision (éviter de mal interpréter), amélioration.");
q(1,"Parmi ces éléments, lequel est un canal digital et non une propriété digitale ?","Paid Search","Site Web","Site mobile","Application mobile","Propriétés : site Web, site mobile, application mobile. Canaux : bannières, Paid Search, e-mail, réseaux sociaux.");
q(1,"Quel domaine d’application désigne les ventes issues de leads en ligne ?","Offline influencé","Concurrence","Enquêtes","Social","Offline influencé = ventes hors ligne issues de leads générés en ligne.");
q(1,"Quel est l’ordre chronologique de l’évolution du Web Analytics ?","Logs → Page tagging → Event tracking (Web 2.0) → Digital analytics","Page tagging → Logs → Digital analytics → Event tracking","Digital analytics → Logs → Page tagging → Event tracking","Event tracking → Logs → Digital analytics → Page tagging","1993–98 logs ; 1999–2004 page tagging ; 2005–09 croissance/événements ; 2010+ digital analytics.");
q(1,"Pourquoi le nombre de hits n’est-il pas le nombre de visiteurs (logs) ?","Une page peut générer plusieurs requêtes ; robots et caches faussent aussi la précision","Un hit correspond toujours à un visiteur mais il est compté deux fois","Les logs ne sont pas enregistrés par le serveur","Les hits ne comptent que les achats","Une seule page déclenche plusieurs requêtes (HTML, images, CSS, JS…).");
q(1,"Le page tagging repose sur :","JavaScript + cookies","Uniquement les fichiers de logs","Des enquêtes papier","Un pare-feu réseau","Le page tagging (1999–2004) mesure pages, visiteurs et comportements via JavaScript et cookies.");
q(1,"L’event tracking, apparu avec le Web 2.0, permet de mesurer :","Clics, vidéos et interactions (contenu dynamique)","Seulement les pages vues","Uniquement les erreurs 404","Seulement les adresses IP","L’objectif évolue : ne plus seulement compter les pages, mais observer les interactions.");
q(1,"Pourquoi parle-t-on de « digital analytics » ?","Le périmètre dépasse le seul Web : mobile, social, campagnes, enquêtes","Le Web a disparu","C’est un autre nom pour les logs","Il ne mesure que les applications mobiles","Le terme reflète l’élargissement du périmètre au-delà du seul Web.");
q(1,"70 % de visiteurs mobiles avec une conversion mobile faible : quelle suite logique ?","Un problème UX est possible : optimiser puis remesurer","Supprimer la version mobile","Conclure que le mobile est inutile","Augmenter le budget sans analyse","Données → analyse → insight (problème UX possible) → décision : optimiser puis remesurer.");
q(1,"Entonnoir 1 000 visiteurs → 600 produits consultés → 200 paniers → 100 paiements → 50 achats. Où la perte relative est-elle la plus forte ?","Produit consulté → Panier (−66,7 %)","Visiteurs → Produit consulté (−40 %)","Panier → Paiement (−50 %)","Paiement → Achat (−50 %)","(600 − 200) ÷ 600 = 66,7 %. Les autres pertes : 40 %, 50 %, 50 %.");
q(1,"Quel enchaînement formalise une démarche d’analyse ?","Constat → Question → Hypothèse → Action → Nouvelle mesure","Hypothèse → Constat → Action → Question → Nouvelle mesure","Action → Constat → Hypothèse → Nouvelle mesure → Question","Question → Action → Constat → Hypothèse → Nouvelle mesure","On observe, on questionne, on formule une hypothèse, on agit, puis on mesure à nouveau.");
q(1,"Un site reçoit 10 000 visiteurs par mois. Peut-on dire qu’il fonctionne bien ?","Non : un chiffre seul ne suffit pas, il faut d’autres données et une analyse","Oui, le trafic est élevé","Non, c’est forcément trop peu","Oui si le nombre de pages est grand","Il faut savoir : nouveaux/récurrents, pages, origine, appareil, conversions, sorties.");
q(1,"Quel est l’ordre des couches de l’écosystème de la mesure digitale ?","Utilisateurs → Points de contact → Collecte & données → Outils d’analyse & reporting → Insights & décisions","Outils d’analyse → Utilisateurs → Décisions → Collecte → Points de contact","Collecte → Utilisateurs → Rapports → Points de contact → Décisions","Insights → Décisions → Collecte → Utilisateurs → Outils","La mesure digitale relie utilisateurs, points de contact, données, plateformes et décisions.");

/* ---------- Séance 2 : Collecte ---------- */
q(2,"Quelle phrase distingue correctement collecter, traiter et analyser ?","Collecter = recevoir les données ; traiter = les organiser ; analyser = les interpréter","Collecter = interpréter ; traiter = recevoir ; analyser = organiser","Ce sont trois mots pour la même étape","Traiter = recevoir ; collecter = organiser ; analyser = supprimer","La collecte n’est qu’une étape du processus.");
q(2,"Quel est l’ordre de la chaîne de l’interaction au rapport ?","Utilisateur → Page/interaction → Mécanisme de collecte → Traitement → Rapport","Utilisateur → Rapport → Collecte → Traitement","Mécanisme → Utilisateur → Rapport → Traitement","Traitement → Collecte → Interaction → Rapport","Architecture à mémoriser : Interaction → Collecte → Traitement → Rapport.");
q(2,"Un log serveur est :","Un fichier journal où le serveur enregistre les requêtes reçues","Un script JavaScript dans la page","Une petite donnée stockée dans le navigateur","Une image invisible de suivi","Navigateur → requête HTTP → serveur Web → fichier LOG.");
q(2,"Dans la ligne « 192.0.2.15 [12/10/2026 14:02] GET /produits 200 », que signifie 200 ?","Code de réponse HTTP : requête traitée avec succès","Le nombre de visiteurs","La durée de la visite en secondes","Le numéro de la page","200 = succès. Le reste : IP, date/heure, méthode HTTP et ressource.");
q(2,"Un code 404 dans les logs signifie :","Ressource non trouvée","Requête réussie","Erreur interne du serveur","Redirection permanente","Les logs permettent de repérer des erreurs HTTP comme le 404.");
q(2,"Chargement d’une page produit : 1 HTML + 2 images + 1 CSS + 1 JavaScript + 1 police. Combien de requêtes possibles ?","6","1","5","7","1 + 2 + 1 + 1 + 1 = 6. D’où : hits ≠ visiteurs.");
q(2,"Une page contient 1 HTML, 3 images, 1 CSS et 2 fichiers JavaScript. Elle génère jusqu’à :","7 requêtes","6 requêtes","3 requêtes","1 requête","1 + 3 + 1 + 2 = 7 requêtes possibles pour une seule page.");
q(2,"Pourquoi un log ne mesure-t-il pas automatiquement un clic sur « Ajouter au panier » sans rechargement ?","Ce clic ne déclenche pas forcément de nouvelle requête serveur","Le serveur ignore le HTML","Les clics sont interdits par HTTP","Les logs ne contiennent que des images","Les logs observent les requêtes, pas les actions dans une page déjà chargée.");
q(2,"Quelle limite des logs est liée au cache ?","Le cache peut éviter certaines requêtes au serveur","Le cache supprime le fichier de logs","Le cache ajoute des cookies","Le cache bloque JavaScript","Robots, cache et hits multiples imposent une interprétation prudente.");
q(2,"Un tag (page tagging) est :","Un petit fragment de code, souvent JavaScript, intégré à la page pour déclencher la collecte","Un fichier journal du serveur","Une donnée texte stockée par le navigateur","Une image distante de 1 pixel","Le tag s’exécute dans le navigateur et rassemble les données disponibles.");
q(2,"Si une page ne contient pas le tag :","Ses consultations et actions risquent de ne pas être collectées","Elles sont collectées via le cookie","Le serveur crée automatiquement le tag","Rien ne change","Il faut vérifier l’installation du tag sur toutes les pages à mesurer.");

q(2,"Un cookie est :","Une petite donnée textuelle stockée dans le navigateur, pas un programme","Un programme exécutable","Un virus","Un fichier journal du serveur","Il peut mémoriser des préférences ou un identifiant technique (ex. identifiant = A123).");
q(2,"Un identifiant de cookie correspond généralement à :","Un navigateur ou contexte technique, pas nécessairement une personne unique","L’identité réelle de la personne","Une personne identifiée sur tous ses appareils","L’adresse postale de l’utilisateur","Si l’utilisateur supprime le cookie, change de navigateur ou d’appareil, les visites peuvent ne pas être reliées.");

q(2,"Quelle catégorie de cookies est davantage soumise aux restrictions des navigateurs ?","Third-party","First-party","Session uniquement","Aucune","Les cookies tiers sont davantage concernés par les restrictions et les enjeux de confidentialité.");
q(2,"Un cookie persistant :","Possède une date d’expiration et peut rester après la fermeture du navigateur","Est toujours supprimé à la fermeture","N’existe que côté serveur","Ne peut pas servir à reconnaître un navigateur","Il peut aider à reconnaître le même navigateur lors d’une prochaine visite.");

q(2,"Quel mécanisme permet de reconnaître le même navigateur lors d’une visite ultérieure ?","Cookie","Logs serveur","Pixel / beacon","Code HTTP 200","Le navigateur renvoie le cookie lors d’une requête ultérieure.");
q(2,"Quel mécanisme mesure un clic sans rechargement de page ?","Tag / event tracking (événement configuré)","Logs serveur seuls","Cookie seul","Code HTTP 404","Le clic doit être prévu et correctement configuré comme événement.");
q(2,"Parmi ces propositions, laquelle ne rend PAS la collecte incomplète ?","Un grand nombre de visiteurs réels","Un tag absent sur une page","JavaScript bloqué","Des cookies supprimés","Causes : tag absent, JavaScript bloqué, cookies supprimés, robots/cache, choix de confidentialité.");
q(2,"Le cookie est-il indispensable à tous les mécanismes de collecte ?","Non : il peut contribuer à identifier un navigateur mais n’est pas indispensable à tous","Oui, sans cookie aucune donnée n’est collectée","Oui pour les logs","Oui pour le pixel uniquement","Les logs enregistrent des requêtes sans cookie ; un tag peut envoyer un événement sans identifiant.");

/* ---------- Séance 3 : KPI ---------- */
q(3,"« 210 inscriptions », « taux de conversion en inscription » et « 25 % » sont respectivement :","Métrique, KPI, cible","KPI, cible, métrique","Cible, métrique, KPI","Métrique, cible, KPI","Métrique = mesure chiffrée. KPI = métrique retenue pour suivre un objectif. Cible = niveau à atteindre.");
q(3,"Quelle est la formule du CTR ?","Clics ÷ impressions × 100","Clics ÷ sessions × 100","Impressions ÷ clics × 100","Dépense ÷ clics","Le dénominateur du CTR est les impressions, pas les sessions.");

q(3,"210 inscriptions terminées pour 960 sessions : quel est le taux de conversion ?","21,9 %","17,5 %","25 %","80 %","210 ÷ 960 × 100 ≈ 21,9 %. (17,5 % = 210 ÷ 1 200, mauvais dénominateur.)");
q(3,"300 sessions ont commencé le formulaire, 210 l’ont terminé : taux d’abandon ?","30 %","70 %","21,9 %","42,9 %","(300 − 210) ÷ 300 × 100 = 30 %. Le dénominateur est le nombre de débuts.");
q(3,"3 600 DH dépensés, 210 inscriptions : coût par inscription ?","17,14 DH","3 DH","12 DH","20 DH","3 600 ÷ 210 ≈ 17,14 DH. Cible du cours : ≤ 20 DH → atteinte.");
q(3,"960 sessions pour 1 200 clics : taux clic → session ?","80 %","20 %","21,9 %","6 %","960 ÷ 1 200 = 80 %. 20 % des clics n’ont pas correspondu à une session mesurée.");
q(3,"200 sessions dont 70 sans engagement : taux de rebond ?","35 %","65 %","70 %","3,5 %","70 ÷ 200 × 100 = 35 %.");
q(3,"Une session est engagée si elle :","Dure plus de 10 s, OU déclenche un événement clé, OU contient au moins 2 pages vues","Dure plus de 60 s ET contient 5 pages vues","Se termine obligatoirement par un achat","Provient d’un canal payant","Un seul des trois critères suffit (définition du cours).");
q(3,"Un taux de rebond élevé est :","Un signal à examiner, pas une preuve de problème","La preuve que le site est mauvais","Toujours bon signe","Sans intérêt","Une page peut répondre immédiatement au besoin : il faut analyser contexte, page et source.");
q(3,"Entonnoir 960 → 480 → 300 → 210 sessions. Où la perte relative est-elle la plus forte ?","960 → 480 (−50 %)","480 → 300 (−37,5 %)","300 → 210 (−30 %)","Les trois sont identiques","Entre la page d’arrivée et l’ouverture du formulaire.");
q(3,"Quelle est la perte relative entre 480 et 300 sessions ?","−37,5 %","−62,5 %","−30 %","−60 %","(480 − 300) ÷ 480 = 0,375.");
q(3,"Recherche payante : 150 inscriptions pour 600 sessions. Réseaux sociaux : 60 pour 360. Quelle source convertit le mieux ?","Recherche payante (25 % contre 16,7 %)","Réseaux sociaux (25 % contre 16,7 %)","Égalité","Impossible à calculer","150 ÷ 600 = 25 % ; 60 ÷ 360 = 16,7 %. Total : 21,9 %.");
q(3,"Quel est le dénominateur du CTR ?","Les impressions","Les sessions","Les clics","La dépense","CTR = clics ÷ impressions.");
q(3,"Un CTR élevé prouve-t-il que la campagne génère beaucoup d’inscriptions ?","Non : un clic ne garantit pas une inscription","Oui, toujours","Oui si le CPC est faible","Oui si le rebond est nul","Faux dans le vrai/faux du cours.");
q(3,"Un KPI est-il nécessairement un taux exprimé en pourcentage ?","Non : il peut être un volume, une durée, un coût ou un taux","Oui, toujours","Oui, sauf pour les coûts","Oui, sauf pour les volumes","Faux dans le vrai/faux du cours.");
q(3,"Un taux d’abandon de 30 % indique :","Un point à investiguer, pas automatiquement sa cause","Que le formulaire est trop long","Que la campagne est mauvaise","Que les cookies sont supprimés","Constat (30 %) → hypothèse → action à tester → nouvelle mesure.");
q(3,"Quels éléments définissent un KPI interprétable ?","Objectif, formule, périmètre, période, cible","Logo, couleur, titre, police, date","Serveur, cookie, tag, pixel, log","Impressions, clics, sessions, ventes, coût","Un KPI sans dénominateur ou sans période est ambigu.");
q(3,"Quel objectif est mesurable ?","Atteindre 25 % de conversion des sessions en inscriptions le mois prochain","Améliorer le site","Obtenir davantage de trafic","Avoir un beau site","Objectif → question de mesure → indicateur → cible → période.");
q(3,"CTR 6 % (cible ≥ 5 %), CPC 3 DH (≤ 4), conversion 21,9 % (≥ 25 %), coût/inscription 17,14 DH (≤ 20). Décision prioritaire ?","Examiner la conversion avant d’augmenter le budget","Augmenter le budget immédiatement","Changer l’annonce car le CTR est trop bas","Réduire le CPC","Seul le taux de conversion est sous la cible.");
q(3,"Recherche payante : 360 DH pour 30 inscriptions. Réseaux sociaux : 270 DH pour 27. Si la priorité est le coût par inscription :","Réseaux sociaux (10 DH contre 12 DH)","Recherche payante (10 DH contre 12 DH)","Aucune différence","Les deux à 11 DH","360 ÷ 30 = 12 DH ; 270 ÷ 27 = 10 DH.");
q(3,"3 utilisateurs peuvent générer 5 sessions et 14 pages vues. Quelle relation est correcte ?","Un utilisateur peut avoir plusieurs sessions, une session plusieurs pages vues","Un utilisateur = une session = une page vue","Une page vue contient plusieurs sessions","Une session contient plusieurs utilisateurs","Utilisateur, session et page vue sont trois réalités différentes.");
q(3,"Quel KPI répond à « Le formulaire décourage-t-il des personnes qui l’ont commencé ? »","Taux d’abandon du formulaire","CTR","CPC","Taux de rebond","On choisit le KPI à partir de la question, pas de la formule.");
q(3,"Recherche payante : 144 clics / 2 400 impressions. Réseaux sociaux : 210 / 6 000. CTR respectifs ?","6 % et 3,5 %","3,5 % et 6 %","6 % et 6 %","60 % et 35 %","144 ÷ 2 400 = 6 % ; 210 ÷ 6 000 = 3,5 %.");
q(3,"CPC des réseaux sociaux : 270 DH pour 210 clics ≈","1,29 DH","0,78 DH","10 DH","2,50 DH","270 ÷ 210 ≈ 1,29 DH. (Recherche : 360 ÷ 144 = 2,50 DH.)");
q(3,"Conversion : recherche payante 30 inscriptions / 120 sessions ; réseaux sociaux 27 / 180. Résultats ?","25 % et 15 %","15 % et 25 %","20 % et 20 %","30 % et 27 %","30 ÷ 120 = 25 % ; 27 ÷ 180 = 15 %.");
q(3,"Avant d’élargir le budget, il faut :","Comparer la qualité des inscriptions, la période et le volume disponible","Choisir le meilleur chiffre unique","Ignorer le coût","Supprimer le tag","La décision doit être justifiée par un objectif et des preuves, pas par un seul chiffre.");

function themeOf(x){
  const txt=x.t+" "+x.o[0];
  if(x.ch===3)return (x.t.match(/\d+/g)||[]).length>=2?"Calculs & cas pratiques":"Concepts KPI";
  const rules=TH_RULES[x.ch]||[];
  for(let i=0;i<rules.length;i++)if(rules[i][1].test(txt))return rules[i][0];
  return TH_DEF[x.ch];
}

const nf=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const fr=(n,d)=>{let s=Number(n).toFixed(d===undefined?1:d);if(s.indexOf(".")>-1)s=s.replace(/0+$/,"").replace(/\.$/,"");return s.replace(".",",")};
const pc=n=>fr(n,1)+" %";
function mk(ch,t,opts,e,th){
  if(new Set(opts).size!==4)return null;
  return {ch:ch,t:t,o:opts,e:e,th:th||"Calculs générés",tk:"gen",gen:1};
}

function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

function chain(a){return '<div class="chain">'+a.map(x=>'<span class="node">'+x+'</span>').join('<span class="arr" aria-hidden="true">→</span>')+'</div>'}
function funnel(rows){
  const max=rows[0][1];let worst=-1,wl=-1;
  const loss=rows.map((r,i)=>i?(rows[i-1][1]-r[1])/rows[i-1][1]*100:0);
  loss.forEach((l,i)=>{if(l>wl){wl=l;worst=i}});

function pickIds(ch,n){
  const now=Date.now();let ids=idsOf(0);
  if(ch==="daily"){const due=shuffle(ids.filter(i=>DB.q[i]&&(DB.q[i].d||0)<=now)).sort((a,b)=>(DB.q[a].l-DB.q[b].l));const nw=shuffle(ids.filter(i=>!DB.q[i]));return shuffle(due.concat(nw).slice(0,n==="all"?30:+n))}
  if(ch==="err")ids=ids.filter(i=>DB.q[i]&&DB.q[i].l===0);
  else if(ch.slice(0,2)==="t:")ids=ids.filter(i=>Q[i].tk===ch.slice(2));
  else if(ch!=="all")ids=ids.filter(i=>Q[i].ch===+ch);
  const pr=i=>!DB.q[i]?1:(DB.q[i].l===0?0:2);
  ids=shuffle(ids).sort((a,b)=>pr(a)-pr(b));
  return shuffle(ids.slice(0,n==="all"?ids.length:+n));
}

function startExam(){
  const nGen=xGen?Math.round(xSetN*0.2):0,nBank=xSetN-nGen;
  const lists=[1,2,3,4].map(c=>shuffle(idsOf(c)));const ids=[];let k=0;
  while(ids.length<nBank&&lists.some(l=>l.length)){const l=lists[k%4];if(l.length)ids.push(l.pop());k++}
  const items=ids.map(mkItem);for(let i=0;i<nGen;i++)items.push(mkItem(genQ()));
  X={items:shuffle(items),ans:[],flags:{},i:0,end:Date.now()+xSetN*60000,min:xSetN,done:false,confirm:false,rf:"wrong",pen:xPen};
  X.items.forEach((_,i)=>{X.ans[i]=null});
}
function vExam(){
  if(!X)return vExamSetup();
  if(!X.done&&Date.now()>X.end)finishExam();
  if(X.done)return vExamResult();
  const it=X.items[X.i],qq=it.q,n=X.items.length;
  const answered=X.ans.filter(a=>a!==null).length;
  const grid=X.items.map((_,i)=>'<button class="qn'+(i===X.i?" cur":X.ans[i]!==null?" done":"")+(X.flags[i]?" flag":"")+'" data-a="xgo" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>').join("");
  const un=n-answered;
  return '<div class="stack"><div class="xbar"><div class="qhead"><span class="timer" id="timer">'+fmtT((X.end-Date.now())/1000)+'</span><span class="small muted mono">'+answered+'/'+n+' répondues</span></div><div class="qnav">'+grid+'</div></div>'+
  '<div class="qhead"><span class="mono small muted">Question '+(X.i+1)+' / '+n+'</span><button class="btn sm" data-a="xflag" aria-pressed="'+(!!X.flags[X.i])+'">'+(X.flags[X.i]?"Retirer le marquage":"Marquer à revoir")+'</button></div>'+
  '<div class="qtext">'+qq.t+'</div><div class="opts">'+optsHtml(it,null,X.ans[X.i],"xpick")+'</div>'+
  '<div class="row"><button class="btn" data-a="xprev"'+(X.i===0?" disabled":"")+'>Précédente</button><button class="btn" data-a="xnext"'+(X.i===n-1?" disabled":"")+'>Suivante</button><button class="btn pri" data-a="xfin">Terminer</button></div>'+
  '<div class="hint"><kbd>A</kbd>–<kbd>D</kbd> répondre · <kbd>←</kbd> <kbd>→</kbd> naviguer · <kbd>F</kbd> marquer</div>'+
  (X.confirm?'<div class="banner stack" style="gap:8px"><span>'+(un?"Il reste <b>"+un+"</b> question"+(un>1?"s":"")+" sans réponse. ":"")+'Terminer l’examen maintenant ?</span><div class="row"><button class="btn pri" data-a="xyes">Oui, terminer</button><button class="btn" data-a="xno">Continuer</button></div></div>':'')+'</div>';
}
function finishExam(){
  if(X.done)return;
  X.done=true;let ok=0,wr=0;X.per={1:{n:0,s:0},2:{n:0,s:0},3:{n:0,s:0},4:{n:0,s:0}};X.th={};
  X.items.forEach((it,i)=>{const a=X.ans[i],good=a!==null&&it.ord[a]===0;it.pick=a;it.ok=good;if(good)ok++;else if(a!==null)wr++;const c=it.q.ch;X.per[c].n++;if(good)X.per[c].s++;else{const l=thLabel(it.q);X.th[l]=(X.th[l]||0)+1}recAny(it,good)});
  X.raw=ok;X.wr=wr;X.score=X.pen?Math.max(0,ok-wr/4):ok;
  DB.ex.push({t:Date.now(),s:X.score,n:X.items.length,m:X.min,pen:X.pen?1:0});save();
}
function vExamResult(){

  '<div class="grid"><div class="card stack"><h3>Par séance</h3>'+per+'</div>'+(ths.length?'<div class="card stack"><h3>Thèmes à retravailler</h3><ul style="margin:0;padding-left:1.1em">'+ths.map(t=>'<li>'+t+' <span class="muted mono">('+X.th[t]+' erreur'+(X.th[t]>1?"s":"")+')</span></li>').join("")+'</ul></div>':'')+'</div>'+
  '<div class="row between"><h3>Correction</h3><div class="chips"><button class="chip" data-a="xrf" data-v="wrong" aria-pressed="'+(X.rf==="wrong")+'">Erreurs</button><button class="chip" data-a="xrf" data-v="all" aria-pressed="'+(X.rf==="all")+'">Toutes</button></div></div>'+

  '<div class="card stack"><h3>Sauvegarde de la progression</h3><p class="muted small">Ta progression reste dans ce navigateur. Copie ce texte pour la garder ou la reprendre sur un autre appareil.</p><textarea id="exp" readonly aria-label="Sauvegarde exportée"></textarea><div class="row"><button class="btn" data-a="copyexp">Copier</button><span id="cpmsg" class="small muted"></span></div>'+
  '<textarea id="imp" placeholder="Colle ici une sauvegarde à importer" aria-label="Sauvegarde à importer"></textarea><div class="row"><button class="btn" data-a="doimp">Importer</button><span id="impmsg" class="small muted"></span></div></div>'+
  '<div class="card stack"><h3>Raccourcis clavier</h3><ul class="small" style="margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px"><li>Entraînement : <kbd>A</kbd>–<kbd>D</kbd> ou <kbd>1</kbd>–<kbd>4</kbd> répondre, <kbd>Entrée</kbd> question suivante.</li><li>Examen : <kbd>A</kbd>–<kbd>D</kbd> répondre, <kbd>←</kbd> <kbd>→</kbd> naviguer, <kbd>F</kbd> marquer.</li><li>Cartes : <kbd>Espace</kbd> retourner, <kbd>1</kbd> à revoir, <kbd>2</kbd> je savais.</li></ul></div>'+
  '<div class="card stack"><h3>Remettre à zéro</h3><p class="muted small">Efface les réponses, les examens et les cartes de ce navigateur.</p>'+(resetAsk?'<div class="row"><button class="btn danger" data-a="resetyes">Oui, tout effacer</button><button class="btn" data-a="resetno">Annuler</button></div>':'<div><button class="btn danger" data-a="resetask">Effacer ma progression</button></div>')+'</div></div>';
}
let resetAsk=false;
function afterRender(r){
  if(r==="reglages"){const e=document.getElementById("exp");if(e)e.value=JSON.stringify(DB)}
}

/* ---------- Routeur ---------- */
const ROUTES={accueil:vHome,fiches:vFiches,cartes:vCards,entrainement:vPractice,examen:vExam,erreurs:vErrors,reglages:vSettings};
function route(){return (location.hash||"#accueil").slice(1)}
function render(){
  clearInterval(timerId);timerId=null;
  let r=route();if(!ROUTES[r])r="accueil";
  document.querySelectorAll("#nav a").forEach(a=>{const on=a.dataset.r===r;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  view.innerHTML=ROUTES[r]();
  afterRender(r);
  if(r==="examen"&&X&&!X.done){timerId=setInterval(tick,500)}
  window.scrollTo(0,0);
}
function rerender(keep){const y=window.scrollY;render();if(keep)window.scrollTo(0,y)}
function tick(){
  if(!X||X.done){clearInterval(timerId);return}
  const left=(X.end-Date.now())/1000,t=document.getElementById("timer");
  if(left<=0){finishExam();render();return}
  if(t){t.textContent=fmtT(left);t.classList.toggle("low",left<60)}
}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}

/* ---------- Thème ---------- */
function applyTheme(v){try{localStorage.setItem("wa_theme",v)}catch(e){}const el=document.documentElement;if(v==="light"||v==="dark")el.setAttribute("data-theme",v);else el.removeAttribute("data-theme")}
function curDark(){const t=document.documentElement.getAttribute("data-theme");if(t)return t==="dark";return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
try{const t=localStorage.getItem("wa_theme");if(t&&t!=="auto")applyTheme(t)}catch(e){}
function setThemeBtn(){const b=document.getElementById("themeBtn");if(b)b.textContent=curDark()?"Mode clair":"Mode sombre"}
setThemeBtn();
document.getElementById("themeBtn").addEventListener("click",function(){applyTheme(curDark()?"light":"dark");setThemeBtn()});

/* ---------- Actions ---------- */
const A={
  gofiche:d=>{ficheTab=+d.c;go("fiches")},
  ftab:d=>{ficheTab=+d.c;rerender(false)},
  gocards:d=>{fcCh=String(d.c);FS=null;go("cartes")},
  goprac:d=>{pSetCh=String(d.c);P=null;go("entrainement")},
  gotheme:d=>{pSetCh="t:"+d.k;P=null;go("entrainement")},
  psetch:d=>{pSetCh=d.v;rerender(true)},
  psetn:d=>{pSetN=d.v==="all"?"all":+d.v;rerender(true)},
  pstart:()=>{
    let items;
    if(pSetCh==="calc"){const n=pSetN==="all"?20:+pSetN;items=[];for(let i=0;i<n;i++)items.push(mkItem(genQ()))}
    else{const ids=pickIds(pSetCh,pSetN);if(!ids.length){P=false;rerender(false);return}items=ids.map(mkItem)}
    P={items:items,i:0,score:0};rerender(false)},
  ppick:d=>{const it=P.items[P.i];if(it.pick!==null)return;it.pick=+d.p;const ok=it.ord[it.pick]===0;recAny(it,ok);if(ok)P.score++;save();rerender(true)},
  pnext:()=>{P.i++;rerender(false)},
  pquit:()=>{P=null;rerender(false)},
  pagain:()=>{P=null;rerender(false)},
  goerr:()=>{pSetCh="err";P=null;go("entrainement")},
  xsetn:d=>{xSetN=+d.v;rerender(true)},
  xgen:()=>{xGen=!xGen;rerender(true)},
  xpen:()=>{xPen=!xPen;rerender(true)},
  xstart:()=>{startExam();rerender(false)},
  xpick:d=>{if(X.done)return;X.ans[X.i]=+d.p;X.confirm=false;rerender(true)},
  xgo:d=>{X.i=+d.i;rerender(false)},
  xprev:()=>{if(X.i>0){X.i--;rerender(false)}},
  xnext:()=>{if(X.i<X.items.length-1){X.i++;rerender(false)}},
  xflag:()=>{X.flags[X.i]=!X.flags[X.i];rerender(true)},
  xfin:()=>{X.confirm=true;rerender(true)},
  xno:()=>{X.confirm=false;rerender(true)},
  xyes:()=>{finishExam();rerender(false)},
  xagain:()=>{X=null;rerender(false)},
  xrf:d=>{X.rf=d.v;rerender(true)},
  fcch:d=>{fcCh=d.v;rerender(true)},
  fstart:()=>{const deck=shuffle(fcDue(fcCh)).slice(0,25);if(!deck.length){FS={deck:[],i:0,ok:0,flip:false};rerender(false);return}FS={deck:deck,i:0,ok:0,flip:false};rerender(false)},
  fflip:()=>{FS.flip=!FS.flip;rerender(true)},
  fgrade:d=>{const i=FS.deck[FS.i],s=DB.fc[i]||{b:0,d:0};if(+d.v){s.b=Math.min((s.b||0)+1,5);s.d=Date.now()+BOX[s.b]*DAY;FS.ok++}else{s.b=0;s.d=0}DB.fc[i]=s;touch();save();FS.i++;FS.flip=false;rerender(false)},
  fquit:()=>{FS=null;rerender(false)},
  fagain:()=>{FS=null;rerender(false)},
  theme:d=>{applyTheme(d.v);setThemeBtn()},
  copyexp:()=>{const e=document.getElementById("exp"),m=document.getElementById("cpmsg");const txt=e.value;
    const fallback=()=>{e.select();if(m)m.textContent="Sélectionné : copie avec Ctrl+C."};
    try{navigator.clipboard.writeText(txt).then(()=>{if(m)m.textContent="Copié."},fallback)}catch(x){fallback()}},
  doimp:()=>{const t=document.getElementById("imp").value.trim(),m=document.getElementById("impmsg");
    try{const o=JSON.parse(t);if(!o||typeof o!=="object"||typeof o.q!=="object")throw 0;
      const n={q:{},ex:[],fc:{},calc:{n:0,c:0},days:{}};
      Object.keys(o.q).forEach(k=>{const r=o.q[k];if(+k>=0&&+k<Q.length&&r)n.q[k]={n:+r.n||0,c:+r.c||0,l:r.l?1:0,b:Math.max(0,Math.min(5,+r.b||0)),d:+r.d||0}});
      (o.ex||[]).forEach(e=>{if(e&&+e.n>0)n.ex.push({t:+e.t||0,s:+e.s||0,n:+e.n,m:+e.m||0,pen:e.pen?1:0})});
      Object.keys(o.fc||{}).forEach(k=>{const r=o.fc[k];if(+k>=0&&+k<FC.length&&r)n.fc[k]={b:+r.b||0,d:+r.d||0}});
      if(o.calc)n.calc={n:+o.calc.n||0,c:+o.calc.c||0};
      Object.keys(o.days||{}).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k))n.days[k]=+o.days[k]||0});
      DB=n;save();rerender(false);const mm=document.getElementById("impmsg");if(mm)mm.textContent="Importé."}
    catch(x){if(m)m.textContent="Texte non reconnu : colle une sauvegarde complète."}},
  resetask:()=>{resetAsk=true;rerender(true)},
  resetno:()=>{resetAsk=false;rerender(true)},
  resetyes:()=>{DB={q:{},ex:[],fc:{},calc:{n:0,c:0},days:{}};save();P=null;X=null;FS=null;resetAsk=false;rerender(false)}
};
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-a]");if(!t)return;
  const f=A[t.dataset.a];if(f)f(t.dataset);
});
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,tn=t&&t.tagName;if(tn==="TEXTAREA"||tn==="INPUT")return;
  const k=e.key.toLowerCase(),r=route();
  if((tn==="BUTTON"||tn==="A")&&(k==="enter"||k===" "))return;
  const idx={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[k];
  if(r==="entrainement"&&P&&P.items&&P.i<P.items.length){
    const it=P.items[P.i];
    if(it.pick===null){if(idx!==undefined){A.ppick({p:idx});e.preventDefault()}}
    else if(k==="enter"||k==="arrowright"||k===" "){A.pnext();e.preventDefault()}
  }else if(r==="examen"&&X&&!X.done){
    if(idx!==undefined){A.xpick({p:idx});e.preventDefault()}
    else if(k==="arrowright")A.xnext();else if(k==="arrowleft")A.xprev();else if(k==="f")A.xflag();
  }else if(r==="cartes"&&FS&&FS.i<FS.deck.length){
    if(k===" "||k==="enter"){A.fflip();e.preventDefault()}
    else if(FS.flip&&k==="1")A.fgrade({v:0});else if(FS.flip&&k==="2")A.fgrade({v:1});
  }
});
window.addEventListener("hashchange",render);
render();
})();
</script>
